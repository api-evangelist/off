name: 'OFF'
description: 'OFF (Off-Live, off.live) is an enterprise AI software company building intelligent
  applications that help organizations streamline, innovate, and grow. Its products include AiVee,
  a smart scheduling assistant that uses computer vision to turn calendar images into digital events
  and manage invitations across popular calendar apps, and Pumky, a text-to-image generation platform
  with customizable artistic styles for both beginners and professionals. The company builds on
  computer vision, multilingual large language models, and domain-specialized AI models. Backed by
  Coinbase Ventures, Samsung Next, and Electric Capital. Surfaced as a portfolio company of
  electric-capital and added to the API Evangelist network as a stub. As of this enrichment pass the
  company publishes no public API, developer portal, SDK, or documentation surface.'
